apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 1
  progressDeadlineSeconds: 120
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: devon-demo:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: MODE, value: api }
            - { name: BALLAST_MB, value: "100" }
          envFrom:
            - configMapRef: { name: api-config }
          ports: [{ containerPort: 8080, name: http }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 96Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
